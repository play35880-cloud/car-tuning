<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تیونینگ خودرو | Car Tuning</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
    </script>

<style>
    #car-viewer {
        width: 100%;
        height: 600px;
    }
</style>

</head>

<body>

     <section class="tuning-page">

        <div class="tuning-header">
            <h1>خودروت رو شخصی‌سازی کن</h1>

            <p>
                قطعات مورد نظر خودت رو انتخاب کن و ماشین رو از تمام زوایا ببین
            </p>
        </div>

        <div class="tuning-workspace">

            <div class="car-section">

                <div id="car-viewer"></div>

            </div>

            <div class="tuning-panel">

                <h2>بخش‌های تیونینگ</h2>

                <button class="tuning-option">
                    <span>🛞</span>
                    رینگ و لاستیک
                </button>

                <button class="tuning-option">
                    <span>💡</span>
                    چراغ‌ها
                </button>

                <button class="tuning-option">
                    <span>🚘</span>
                    اسپویلر
                </button>

                <button class="tuning-option">
                    <span>🔧</span>
                    اگزوز
                </button>

                <button class="tuning-option">
                    <span>📏</span>
                    ارتفاع خودرو
                </button>

                <button class="tuning-option">
                    <span>🎨</span>
                    رنگ خودرو
                </button>

            </div>

        </div>

    </section>

    <script type="module" src="tuning.js"></script>

</body>
